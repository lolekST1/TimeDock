name: Build APK

# Builds an installable Android APK and uploads it as an artifact, so the app
# can be tried on a phone without a local Flutter/Android setup:
#   GitHub → Actions → this run → Artifacts → timedock-apk → download → install.
# Runs on every push to the working branch and can be triggered manually.

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # Debug APK: installable via sideload without release signing setup.
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: timedock-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
